[project]
name = "flujocero"
version = "0.1.0"
description = "Inteligencia de inversión inmobiliaria residencial en Chile"
requires-python = ">=3.11"
dependencies = [
  "httpx[http2]>=0.27",
  "tenacity>=8.2",
  "selectolax>=0.3",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "duckdb>=1.0",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "playwright>=1.44",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "typer>=0.12",
  "xlrd>=2.0.2", # lee el .xls de tasas de la CMF (formato BIFF antiguo)
  "pytz>=2026.3.post1",
]

[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "hypothesis>=6.100", "ruff==0.16.5", "mypy>=1.10", "xlwt>=1.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flujocero"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Seleccion explicita: el conjunto por defecto de ruff cambia entre versiones y con el
# el veredicto del gate (CLAUDE.md 3.6). E/F son los errores reales; I ordena imports.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: usa fixtures grabadas, nunca la red viva"]

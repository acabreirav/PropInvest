  exige_primera_vivienda: {v: null, evidence: C, nota: "DISPUTADO. Ver CLAUDE.md §2.2 y D-017. Modelar ambos escenarios."}
  # Respuesta recibida el 29-ago-2026: UNA unidad por persona, por el requisito de primera
  # vivienda, con cruce SII/CBR que bloquea si el RUT ya registra propiedades habitacionales.
  # Queda en `C` y NO en `V` porque llego SIN fuente primaria y contradice la lectura del
  # Decreto 180 art. 3, que ata el beneficio a la "primera VENTA de la vivienda" —condicion
  # del inmueble— y no al comprador. Una de las dos lecturas esta mal y no la decide el modelo.
  limite_subsidios_por_persona: {v: 1, evidence: C, nota: "sin fuente primaria; ver D-017"}
  tasa_uniforme_entre_tramos: {v: true, evidence: V, fuente: "consulta 29-ago-2026; cierra D-009"}
  aplica_a_renegociados: {v: false, evidence: V}

# Instrumento DISTINTO del subsidio a la tasa, y la prensa los mezcla en un solo titular.
# Se documenta aqui para que nadie lo vuelva a confundir. NO entra al modelo: ver D-015.
subsidio_ds1_tramo4:
  nombre: "Subsidio Tramo 4.000 (DS1 Tramo 4)"
  aporte_directo_uf: {v: 400, evidence: V, fuente: "anuncio Minvu / gob.cl ago-2026"}
  tope_valor_vivienda_uf: {v: 4000, evidence: V}
  tope_zonas_extremas_uf: {v: 4500, evidence: V, nota: "Arica y Parinacota, Tarapaca, Antofagasta, Aysen, Magallanes, Palena, Chiloe"}
  ahorro_minimo_uf: {v: 200, evidence: V, nota: "cuenta de ahorro para la vivienda, 12 meses de antiguedad"}
  admite_vivienda_usada: {v: true, evidence: V}
  cupos_primer_llamado: {v: 5000, evidence: V}
  primer_llamado: "2026-11"
  exige_registro_social_hogares: {v: true, evidence: V}
  aplicable_a_este_inversionista: {v: false, evidence: V}
  razon_no_aplicable: >
    El DS1, en cualquiera de sus tramos, obliga a que la vivienda sea habitada
    personalmente por el beneficiario y prohibe arrendarla o venderla por 5 anos desde la
    compra. La tesis completa de este proyecto es arrendar desde el primer mes: no es
    suboptimo, es incompatible. Tomarlo y arrendar igual es causal de revocacion.


# T-014b · como se combinan los tres insumos censales/de oferta en `riesgo_microzona`.
# Los COMPONENTES son D (calculo sobre el Censo 2024 y los avisos activos); estos PESOS
# son E y por eso van aca, con rango, medibles con `cli sensibilidad`.
riesgo_microzona:
  peso_desocupacion: {v: 0.5, evidence: E, rango: [0.3, 0.7], nota: "vacancia estructural censal"}
  peso_saturacion: {v: 0.3, evidence: E, rango: [0.1, 0.5], nota: "avisos activos / hogares arrendatarios (B2)"}
  peso_profundidad: {v: 0.2, evidence: E, rango: [0.0, 0.4], nota: "hogares arrendatarios / hogares; mas = menos riesgo"}

# T-922 · como se convierte "distancia a la estacion elegible mas cercana" en el
# catalizador 0..1 del §12. El umbral de fecha creible (<=3 anios) es del propio §12.
catalizador:
  dist_plena_m: {v: 400, evidence: E, rango: [200, 600], nota: "hasta aqui, beneficio pleno (1.0)"}
  dist_max_m: {v: 1200, evidence: E, rango: [800, 2000], nota: "mas alla, 0: la caminata deja de vender"}
  factor_en_construccion: {v: 0.7, evidence: E, rango: [0.4, 1.0], nota: "descuento por riesgo de fecha de apertura"}
  horizonte_fecha_anios: {v: 3, evidence: V, nota: "CLAUDE.md §12: fecha creible <= 3 anios"}

score:
  # D-012 (28-ago-2026, aprobada por el inversionista): el componente de mayor peso pasa
  # de deficit de CAJA a COSTO REAL de tenencia, o sea el deficit neto de amortizacion.
  # Entre 69% y 84% del deficit mensual no es gasto: compra patrimonio. Ordenar por caja
  # exageraba el costo entre 3 y 6 veces. La liquidez queda protegida por la exclusion
  # dura `deficit_caja_max_clp`, no por el puntaje.
  pesos:
    costo_tenencia_mensual_uf: 0.30
    pie_minimo_flujo_cero: 0.20
    tir_real_apalancada_10a: 0.20
    riesgo_microzona: 0.15
    catalizador: 0.10
    descuento_vs_microzona: 0.05
  exclusiones_duras:
    precio_max_uf: 6000
    # Filtro de liquidez: se lee de `inversionista.yml:restricciones.deficit_mensual_tolerado_clp`.
    # null = sin filtro. Es exclusion dura, no penalizacion: una unidad que exige mas caja
    # de la que el inversionista quiere comprometer no compite, se cae.
    aplicar_deficit_caja_max: true
    # D-015 (28-ago-2026): el stock usado entra al ranking como ESCENARIO. No recibe el
    # subsidio a la tasa —el Decreto 180 art. 3 exige primera venta del inmueble— y el
    # motor se lo niega en `finance/modelo.tasa_aplicable`, no aca.
    solo_vivienda_nueva: false
    m2_utiles_max: 140
    min_comparables_arriendo: 8
    excluir_microzonas_saturadas: true
    excluir_precio_estimado: true


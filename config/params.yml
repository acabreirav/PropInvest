# ============================================================
# Fuente única de supuestos del modelo. NINGÚN número mágico en el código.
# Convención: TODOS los flujos en UF (términos reales).
# evidence: V verificado | C fuentes en conflicto | E estimado
# Calibración: 28-ago-2026
# ============================================================


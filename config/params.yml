ingresos:
  reajuste_arriendo: anual_ipc
  factor_erosion_intra_anual: {v: 0.985, evidence: V, nota: "= 1/(1+pi/2). APLICAR SIEMPRE."}
  rentabilidad_bruta_referencia: {v: 0.045, evidence: V, rango: [0.036, 0.060]}
  min_comparables_por_microzona: 8
  # Rangos de m2 utiles. El §2.4 fija `(microzona, tipologia, rango_m2)` como la clave de todo
  # comparable: dentro de una misma microzona y tipologia, un 2D de 45 m2 y uno de 85 m2 no se
  # arriendan al mismo precio, y mezclarlos corre la mediana hacia donde haya mas oferta.
  # Los cortes siguen la oferta real del stock chileno: studio, 1D, 2D chico, 2D grande, 3D+.
  # El tope de 140 no es arbitrario: sobre eso se pierde el regimen DFL2.
  # D-018 (30-ago-2026): se parte `0-35` en `0-25` y `25-35`. Medido sobre datos reales, la
  # banda `0-35` estaba dominada por sus unidades grandes —el 60% de los comparables 1D1B
  # media 31-35 m2— asi que su mediana describia a un depto grande. A uno de 22-26 m2 se le
  # acreditaba +17% de arriendo, y como el arriendo es el numerador del yield, ese +17% se
  # trasladaba entero al yield y lo subia en el ranking. Costo: 34 unidades dejan de rankear.
  rangos_m2: [[0, 25], [25, 35], [35, 50], [50, 70], [70, 100], [100, 140]]


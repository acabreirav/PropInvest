# Perfil del inversionista. El motor lee esto junto con params.yml.
# Cambiar acá y volver a correr `make score` recalcula todo el ranking.

perfil:
  nombre: "Alvaro"
  tipo: persona_natural            # CRÍTICO: la persona jurídica NO accede a DFL2
  propiedades_actuales: 0
  viviendas_dfl2_actuales: 0

elegibilidad:
  # Resuelto: al no ser propietario, califica bajo CUALQUIERA de las dos lecturas
  # del requisito en disputa (D-001). El escenario base pasa a ser `con_subsidio`.
  califica_subsidio_tasa: true
  califica_tramo_general_uf6000: true
  califica_tramo_especial_uf3000: probable   # 6.000 cupos reservados que EXIGEN primera vivienda
  nota_tramo_especial: >
    El Decreto 180 art. 4 reserva 6.000 cupos a viviendas <= UF 3.000 exigiendo primera
    vivienda del solicitante. Otras fuentes lo describen atado a subsidios DS1/DS19.
    VERIFICAR CON EL BANCO: si la tasa del tramo especial es mejor que la del general,
    apuntar a tickets <= UF 3.000 es la jugada dominante para este perfil.
  califica_fogaes_90ltv: true

estrategia_dfl2:
  objetivo_unidades: 2             # el máximo por persona natural (Ley 20.455)
  max_m2_utiles: 140               # sobre esto se pierde DFL2. Exclusión dura del ranking.
  exigir_dfl2: true                # solo se rankean unidades acogidas a DFL2
  nota_escalamiento: >
    La 3a propiedad pierde arriendo exento de renta, la rebaja de 50% de contribuciones
    y la exencion de IVA de arriendo: su economia es estructuralmente peor. Antes de
    llegar ahi, evaluar una segunda persona natural (conyuge con separacion de bienes),
    NUNCA una sociedad.
  exencion_ganancia_capital_uf: 8000   # acumulativa de por vida, por persona
  # D-011: conyuge bajo PARTICIPACION EN LOS GANANCIALES (patrimonios separados durante
  # el matrimonio), sin propiedades y con 0 cupos DFL2. El hogar tiene 4 cupos, no 2.
  # PERO: el ahorro de $40.000.000 es de EL, no del hogar. La compra es INDIVIDUAL.
  # La conyuge entra, si acaso, como codeudora solidaria para respaldar la solicitud,
  # NUNCA como co-propietaria: figurar en la escritura le gastaria un cupo DFL2.
  segunda_persona_natural:
    regimen: participacion_en_los_gananciales
    propiedades_actuales: 0
    viviendas_dfl2_actuales: 0
    califica_subsidio_tasa: true
    renta_liquida_mensual_clp: 2500000
    rol: codeudora_solidaria_sin_copropiedad   # a confirmar con el banco (D-011 pregunta 1)
    aporta_pie: false
    prohibido: "figurar como propietaria en la escritura mientras tenga cupos DFL2 libres"

restricciones:
  # Completar con datos reales antes de correr `make score`.
  renta_liquida_mensual_clp: 2250000   # el banco exige dividendo <= 25% de esto
  ahorro_disponible_pie_clp: 40000000  # techo, no objetivo: prefiere usar bastante menos
  otros_creditos_cuota_mensual_clp: 0  # carga financiera total <= 45% de la renta
  ahorro_mensual_clp: null             # PENDIENTE. Determina cuanto deficit mensual es
                                       # sostenible, que es el criterio #1 del ranking (§12).
  pie_objetivo_pct: 0.10               # no es una meta: es el escenario de contraste.
                                       # El ranking reporta el pie minimo de flujo cero por unidad.
  ticket_max_uf: 6000                  # tope legal. La restriccion real es la capacidad de credito:
                                       # UF 3.497 con subsidio / UF 3.220 sin subsidio (28-ago-2026).
                                       # Correr `cli capacidad` tras cualquier cambio de renta o tasa.

preferencias:
  prioridad_1: flujo_no_negativo
  prioridad_2: plusvalia
  prioridad_3: liquidez_de_salida
  acepta_compra_en_verde: true         # precio congelado + pie en cuotas durante la obra
  acepta_regiones: true                # Concepcion/La Serena/Antofagasta: donde el flujo cierra
  amoblar: false                       # amoblado paga 19% de IVA sobre el arriendo

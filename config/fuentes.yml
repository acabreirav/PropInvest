# Registro de fuentes. Un módulo en src/flujocero/sources/<id>.py por cada entrada habilitada.
# legal_tier: api_oficial > json_publico > html_permitido > html_prohibido (requiere aprobación humana)

fuentes:

  - id: cmf_indicadores
    capa: 6
    legal_tier: api_oficial
    enabled: true
    base: "https://api.cmfchile.cl/api-sbifv3/recursos_api/"
    series: [uf, utm, ipc, tmc]
    auth: apikey_query
    cadencia: diaria
    fallback: gael_indicadores
    notas: "formato=json obligatorio; default es xml"
    modulo: "src/flujocero/sources/cmf_indicadores.py"
    adr: "docs/adr/001-cmf-indicadores.md"
    parser_version: "cmf_indicadores/1.0.0"
    produce: dim_tiempo_financiero
    selftest: "verde contra fixture; forma_verificada=false — falta muestra viva (T-010)"

  - id: gael_indicadores
    capa: 6
    legal_tier: api_oficial
    enabled: true
    base: "https://api.gael.cloud/general/public/monedas"
    auth: ninguna
    rate_limit_duro: "máx 9 req / 10 s — se excede y la IP queda baneada 1 hora"
    cupo_cliente: "6 req / 10 s — margen deliberado: no sabemos si el servidor cuenta igual"
    cadencia: diaria
    rol: respaldo               # NO es fuente alternativa: rellena huecos, nunca pisa
    respalda_a: cmf_indicadores
    series: [uf, utm]
    modulo: "src/flujocero/sources/gael_indicadores.py"
    adr: "docs/adr/006-gael-indicadores.md"
    parser_version: "gael_indicadores/1.0.0"
    produce: dim_tiempo_financiero
    selftest: "VERDE contra muestra viva, 30-ago-2026: forma_verificada=true"
    verificacion_viva: >
      Corrida del 30-ago-2026 desde la maquina del usuario (IP chilena residencial):
      los cinco checks del §7.1 en verde y `forma_verificada=true`. La forma documentada
      resulto ser la real. Ademas, el dia que se solapaba con la CMF coincidio dentro de
      la tolerancia de redondeo: dos fuentes oficiales independientes dan el mismo valor.
    limitacion: >
      El endpoint público NO toma fechas: entrega el valor VIGENTE, no serie histórica.
      Cubre "hoy la CMF no responde"; para el backfill la única fuente sigue siendo la CMF.
      `collect()` falla explícitamente si se le pide un período, en vez de devolver un día
      y dejar creer que devolvió treinta.

  - id: cmf_tasas_hipotecarias
    capa: 6
    legal_tier: json_publico
    enabled: false          # <- DESHABILITADA. Ver razon.
    url: "https://www.cmfchile.cl/portal/estadisticas/617/articles-46417_recurso_1.xls"
    cadencia: mensual
    modulo: "src/flujocero/sources/cmf_tasas_hipotecarias.py"
    adr: "docs/adr/002-cmf-tasas-hipotecarias.md"
    parser_version: "cmf_tasas_hipotecarias/1.0.0"
    produce: dim_tasa_banco
    razon_deshabilitada: >
      El archivo que esa URL sirve HOY es de mayo de 2006: lo declara su celda
      "Fecha de la consulta: 22 al 26 de mayo de 2006", lo firma la SBIF (disuelta en 2019)
      y lista bancos que ya no existen (BankBoston, Banco del Desarrollo, Banco Paris).
      El parser lo lee entero (117 filas, 17 bancos) y luego lo RECHAZA por antiguedad.
      Verificado contra el archivo real el 28-ago-2026. Ver T-907.
    selftest: "parseo verde; frescura ROJA (243 meses de antiguedad)"

  - id: meli_locations
    capa: 2
    legal_tier: api_oficial
    enabled: true
    base: "https://api.mercadolibre.com/classified_locations/countries/CL"
    auth: oauth2
    cadencia: mensual
    produce: dim_microzona

  - id: meli_venta
    capa: 3
    legal_tier: api_oficial
    enabled: false          # <- BLOQUEADA. Ver razon.
    base: "https://api.mercadolibre.com/sites/MLC/search"
    auth: oauth2
    categoria_raiz: "MLC1459"      # Inmuebles  — medido 28-ago-2026 (T-011, brecha G1)
    categoria: "MLC1472"           # Departamentos — medido, no supuesto
    paginacion: "offset+limit; search_type=scan para >1000"
    cadencia: diaria
    adr: "docs/adr/003-meli.md"
    razon_deshabilitada: >
      /sites/MLC/search devolvio HTTP 403 el 28-ago-2026 desde IP chilena residencial,
      CON token valido y SIN token. El mismo token leyo /sites/MLC/categories sin problema,
      asi que no es la app ni la credencial: es ese recurso. Falta medir si queda alguna
      forma admitida (category=, seller_id=, highlights, trends). Ver T-011 y docs/adr/003-meli.md.

  - id: meli_arriendo
    capa: 4
    legal_tier: api_oficial
    enabled: false          # <- BLOQUEADA por la misma razon que meli_venta
    base: "https://api.mercadolibre.com/sites/MLC/search"
    auth: oauth2
    categoria: "MLC1472"
    cadencia: diaria
    adr: "docs/adr/003-meli.md"
    razon_deshabilitada: "misma que meli_venta: HTTP 403 en /sites/MLC/search"

  - id: osm_metro
    capa: 2
    legal_tier: json_publico
    enabled: true
    base: "https://overpass-api.de/api/interpreter"
    auth: ninguna
    cadencia: mensual
    produce: dim_estacion_metro
    nota: >
      OpenStreetMap via Overpass, licencia ODbL con atribucion. Trae la geometria de
      estaciones (Metro Santiago subway + red Biotren); las FECHAS de lo que esta en
      construccion no estan en OSM y viven curadas con fuente en config/metro.yml.

  - id: planok_cotizador
    capa: 3
    legal_tier: json_publico
    enabled: false          # <- lectura investigada y aprobada; cotizaciones PENDIENTES de decision
    base: "https://cotizador.saladeventasdigital.com/rest/controllers/"
    auth: ninguna
    cadencia: semanal
    produce: fact_unidad_venta
    adr: "docs/adr/010-planok-cotizador.md"
    nota: >
      API JSON del cotizador estandar de la industria (robots permite). Leer proyectos,
      modelos y unidades es gratis; el PRECIO solo aparece al generar una cotizacion, que
      crea un registro en el CRM de la inmobiliaria — decision del inversionista (ADR 010).

  - id: portal_busqueda
    capa: 3
    legal_tier: html_permitido      # SOLO rutas `_Desde_`, que el robots.txt permite
    enabled: true
    base: "https://www.portalinmobiliario.com"
    patron_permitido: "/{operacion}/departamento/{tipo}/{comuna}-metropolitana_Desde_{offset}"
    modulo: "src/flujocero/sources/portal_busqueda.py"
    adr: "docs/adr/005-portal-busqueda.md"
    parser_version: "portal_busqueda/1.0.0"
    produce: "fact_unidad_venta + fact_arriendo_comp + dim_microzona"
    cadencia: semanal
    rate_limit: "3 a 5 s entre paginas, aleatorio"
    auth: ninguna                   # anonimo a proposito: ver nota
    nota_identidad: >
      NO se autentica y NO usa User-Agent de navegador. El scraper del proyecto anterior hacia
      las dos cosas mas `--disable-blink-features=AutomationControlled`, y lo que arriesgaba
      no era una IP: era la cuenta de MercadoLibre del usuario. D-016 es explicita en que la
      aprobacion cubre recolectar, no esquivar. Si el portal devuelve 403 a un cliente honesto,
      el colector se detiene y lo reporta.
    nota_ruta: >
      La pagina 1 tambien se pide con `_Desde_1`. El portal la sirve sin sufijo, pero esa forma
      no calza con `/*_Desde_` y quedaria fuera de lo permitido. Devuelve lo mismo.
    cobertura_verificada: >
      Contra las 130 paginas reales del corpus de mayo-2026: 6.076 tarjetas, 5.608 unidades y
      468 proyectos. microzona 99,8%, m2 99,3% y dormitorios 98,9% sobre unidades.

  - id: portal_legado_2026_05
    capa: 3
    legal_tier: html_prohibido      # fichas /MLC-, no permitidas por robots
    aprobacion_humana: "D-016"      # §3.5 exige aprobacion explicita para este tier
    enabled: true
    historica: true                 # <- NO alimenta el ranking: ver razon
    base: "https://www.portalinmobiliario.com"
    modulo: "src/flujocero/sources/portal_legado.py"
    adr: "docs/adr/004-legado-investop.md"
    parser_version: "portal_legado/1.0.0"
    produce: "fact_unidad_venta + fact_arriendo_comp + dim_microzona"
    ventana: "2026-04-30 a 2026-05-05"
    razon_historica: >
      Es la foto que el usuario scrapeo con su proyecto anterior, ingerida con su
      fetched_at real de mayo-2026. El gate de frescura del §7.3 (21 dias) la deja fuera
      del ranking, y eso es lo correcto: su valor es el diccionario de 81 microzonas
      reales, las fixtures de tests/integration y la linea base contra la cual medir que
      bajo de precio en cuatro meses (T-919). Un aviso desaparece cuando se vende, asi que
      esta foto no se puede volver a tomar.
    selftest: "verde — 97% parseado, m2 99,4% sobre avisos de unidad, cero datos personales"

  - id: assetplan_arriendo
    # Capa 6 (contexto), NO capa 4 (arriendo). Cerrado el 31-ago-2026 con la medicion del
    # ADR 008 §7: `units_by_size` aparece 18 veces en la ficha renderizada y las 18 son
    # codigo, no dato. Lo carga Livewire por AJAX despues del render.
    capa: 6
    legal_tier: html_permitido
    enabled: true
    sitemap: "https://www.assetplan.cl/edificios.xml"
    robots_nota: >
      permite EXPLÍCITAMENTE ClaudeBot y Claude-User. OJO: trae
      `Disallow: /arriendo/departamento/*/edificio/` CON COMODÍN, que el verificador de la
      stdlib ignoraba. Sin el arreglo de T-926 habríamos entrado ahí creyendo que se podía.
    # Playwright NO queda justificado por esta fuente (§5): renderizar no trae las unidades,
    # y lo unico que si vale —las distancias a Metro— viaja en el HTML estatico.
    js_render: false
    cadencia: diaria
    adr: "docs/adr/008-assetplan.md"
    notas: >
      176 edificios, lastmod diario.
      CORREGIDO 30-ago-2026 contra la respuesta REAL: la ficha de edificio NO entrega
      arriendo efectivo ni vacancia. La descripción anterior ("mejor proxy de arriendo
      efectivo y vacancia") venía de investigación secundaria, no de mirar bytes.
    entrega_verificado: >
      latlng (coordenadas reales) · nearby_transport[].distance_meters a estación de Metro,
      vía Google Places · min_ggcc por tipología (gastos comunes reales por edificio) ·
      commune, address, multifamily.
    no_entrega_verificado: >
      Nada por unidad: sin m², sin precio por departamento. `units_by_size` lo carga Livewire
      por AJAX y NO está en el HTML. Sin vacancia. Y `min_price` es un "DESDE": el §12 lo
      excluye como `evidence_level: E`, y usarlo como comparable sesgaría la mediana de
      arriendo hacia abajo de forma sistemática — justo en el numerador del yield.

  - id: planok_cotizador
    capa: 3
    legal_tier: json_publico
    enabled: true
    base: "https://cotizador.saladeventasdigital.com/cotizador/"
    descubrimiento: "enumerar key={slug_inmobiliaria} x id_subagrupaciones={etapa}"
    produce: "precio POR UNIDAD + estacionamiento + bodega"
    a_verificar: "método y payload de datos.php; universo de valores key"
    cadencia: semanal

  - id: inmobiliarias_wpjson
    capa: 3
    legal_tier: json_publico
    enabled: true
    procedimiento: "GET /wp-json/wp/v2/types -> CPT proyecto -> ?per_page=100&_embed -> si acf vacío, JSON-LD"
    dominios_verificados: [socovesa.cl, fundamenta.cl, exxacon.cl, rvc.cl, py.cl, imagina.cl]
    dominios_por_verificar: [almagro.cl, pazcorp.com, isinergia.cl, simonetti.cl, ecomac.cl, ictinos.cl, hogares.cl, aconcagua.cl, manquehue.cl]
    cadencia: semanal

  - id: pabellon
    capa: 3
    legal_tier: html_permitido
    enabled: true
    base: "https://pabellon.cl/proyectos-inmobiliarios"
    notas: "muestra unidad + precio UF + dividendo estimado. Sin anti-bot observado"
    cadencia: semanal

  - id: enlace_inmobiliario
    capa: 3
    legal_tier: html_permitido
    enabled: true
    base: "https://www.enlaceinmobiliario.cl/"
    notas: "589 proyectos / 19.433 propiedades solo en RM. White-labels bancarios con la misma data"
    cadencia: semanal

  - id: chilepropiedades_arriendo
    capa: 4
    legal_tier: html_permitido
    enabled: true
    base: "https://chilepropiedades.cl/propiedades/arriendo-mensual/departamento/{comuna}/{pagina}"
    crawl_delay_s: 2
    sitemap: "https://chilepropiedades.cl/sitemaps/sitemapindex.xml"
    cadencia: diaria

  - id: sii_catastro
    capa: 1
    legal_tier: json_publico
    enabled: false
    layout: "docs/01-fuentes.md §D — BRORGA2441N_NAC / BRORGA2441NL_NAC, TAB, sin headers"
    cadencia: anual

  - id: ine_censo_manzanas
    capa: 1
    legal_tier: json_publico
    enabled: false
    formato: geoparquet
    notas: "189 variables por manzana; unidad atómica de la microzonificación"
    cadencia: unica

  - id: wpjson_inmobiliarias
    capa: 3
    legal_tier: html_permitido
    enabled: true
    dominios: [socovesa.cl]        # piloto; la misma ruta sirve para otras WP inmobiliarias
    cadencia: semanal
    modulo: "src/flujocero/sources/wpjson_inmobiliarias.py"
    adr: "docs/adr/011-wpjson-inmobiliarias.md"
    parser_version: "wpjson_inmobiliarias/0.1.0"
    produce: dim_proyecto + fact_unidad_venta (precio_es_desde=TRUE)
    selftest: "verde contra fixture (03-sep-2026); muestra viva pendiente de la primera corrida local"
    notas: >
      Sitemap → REST wp/v2/proyecto/<id> (metadata; la colección redirige a HTML) →
      HTML del proyecto (precio "desde" POR MODELO en bloques planta). No es precio por
      unidad: las filas van marcadas precio_es_desde=TRUE y el ranking las excluye.
      Aporta censo de oferta nueva, comuna/estado por proyecto y señal de baja de precio.

  - id: data_inmobiliaria
    capa: 5
    legal_tier: api_oficial
    enabled: false
    plan: "tier gratuito: mapa + export Excel, 346 comunas"
    requiere_decision_humana: true

  - id: databam
    capa: 5
    legal_tier: api_oficial
    enabled: false
    costo: "desde $50.000/mes"
    requiere_decision_humana: true

  # ---- BLOQUEADAS: requieren aprobación humana explícita en docs/05-decisiones.md ----
